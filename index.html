<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="World Clock BD - offline bilingual world clock, timezone converter and meeting planner for Bangladesh.">
<link rel="icon" href="data:,">
<title>World Clock BD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1 id="appTitle">World Clock BD</h1>
    <p id="tagline" class="tagline"></p>
  </div>
  <div class="controls">
    <button id="hourToggle" type="button" class="pill" aria-label="toggle 12/24 hour">12H</button>
    <button id="langToggle" type="button" class="pill" aria-label="toggle language">BN</button>
  </div>
</header>

<main>
  <section class="panel" aria-labelledby="clockTitle">
    <h2 id="clockTitle"></h2>
    <div class="addrow">
      <input id="citySearch" type="text" list="cityList" autocomplete="off" aria-label="city search">
      <datalist id="cityList"></datalist>
      <button id="addBtn" type="button" class="btn"></button>
    </div>
    <p id="addMsg" class="msg" role="status" aria-live="polite"></p>
    <div id="clockGrid" class="grid"></div>
    <div id="emptyState" class="empty" hidden>
      <h3 id="emptyTitle"></h3>
      <p id="emptyText"></p>
      <button id="restoreBtn" type="button" class="btn"></button>
    </div>
  </section>

  <section class="panel" aria-labelledby="convTitle">
    <h2 id="convTitle"></h2>
    <div class="formrow">
      <label><span id="dateLbl1"></span><input id="convDate" type="date"></label>
      <label><span id="timeLbl1"></span><input id="convTime" type="time"></label>
      <label><span id="fromLbl"></span><select id="convFrom"></select></label>
      <button id="convBtn" type="button" class="btn"></button>
    </div>
    <p id="convMsg" class="msg err" role="alert"></p>
    <p id="convEmpty" class="emptyline"></p>
    <div id="convGrid" class="grid"></div>
  </section>

  <section class="panel" aria-labelledby="planTitle">
    <h2 id="planTitle"></h2>
    <div class="formrow">
      <label><span id="dateLbl2"></span><input id="planDate" type="date"></label>
      <label><span id="timeLbl2"></span><input id="planTime" type="time"></label>
      <button id="planBtn" type="button" class="btn"></button>
    </div>
    <p id="planMsg" class="msg err" role="alert"></p>
    <p id="planEmpty" class="emptyline"></p>
    <div id="planRows" class="rows"></div>
    <div id="planWindow" class="window" hidden></div>
  </section>
</main>

<footer><p id="footer"></p></footer>

<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
